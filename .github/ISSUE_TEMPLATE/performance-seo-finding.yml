name: "⚡ Performance & SEO Finding"
description: Report a performance/SEO audit finding
title: "[Performance] "
labels: ["performance"]
body:
  - type: input
    id: page-url
    attributes:
      label: Page/URL affected
      placeholder: "/"
    validations:
      required: true
  - type: textarea
    id: whats-wrong
    attributes:
      label: What's wrong?
      description: Describe the performance or SEO issue in 1-2 sentences.
    validations:
      required: true
  - type: textarea
    id: how-found
    attributes:
      label: How did you find it?
      description: Tool used (e.g. Lighthouse, PageSpeed Insights) and score/metric.
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Critical
        - High
        - Medium
        - Low
    validations:
      required: true
  - type: textarea
    id: suggested-fix
    attributes:
      label: Suggested fix
    validations:
      required: false
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot
      description: Drag and drop or paste an image, if applicable.
    validations:
      required: false
