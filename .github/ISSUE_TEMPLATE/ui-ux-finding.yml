name: "🎨 UI/UX & Mobile Finding"
description: Report a responsiveness/UX audit finding
title: "[UI/UX] "
labels: ["ui-ux"]
body:
  - type: input
    id: page-url
    attributes:
      label: Page/URL affected
      placeholder: "/admissions"
    validations:
      required: true
  - type: textarea
    id: whats-wrong
    attributes:
      label: What's wrong?
      description: Describe the UI/UX or responsiveness issue in 1-2 sentences.
    validations:
      required: true
  - type: textarea
    id: how-found
    attributes:
      label: How did you find it?
      description: Device/browser/screen size tested, or tool used.
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Critical
        - High
        - Medium
        - Low
    validations:
      required: true
  - type: textarea
    id: suggested-fix
    attributes:
      label: Suggested fix
    validations:
      required: false
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot
      description: Drag and drop or paste an image, if applicable.
    validations:
      required: false
